# Compila o instalador, roda os testes de conversão e publica um release novo a cada push
# na main. A versão sobe sozinha a partir do último release:
#   - padrão: correção (2.1.0 -> 2.1.1)
#   - "#minor" na mensagem do commit: 2.1.0 -> 2.2.0
#   - "#major" na mensagem do commit: 2.1.0 -> 3.0.0
#   - "[skip ci]" na mensagem: não compila nem publica
# Mudanças só em documentação não geram release. Em pull requests só compila e testa.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'assets/**'
      - 'tests/*.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python, LibreOffice e Tesseract não ficam no repositório (cerca de 2 GB). Eles são
  # reaproveitados do instalador deste release, conferido pelo SHA256SUMS.txt publicado.
  # Para atualizar algum componente, publique um release com os novos binários e troque aqui.
  COMPONENTS_RELEASE: v2.1.0

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Definir versão
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName
          if ($LASTEXITCODE -ne 0 -or $latest -notmatch '^v?(\d+)\.(\d+)\.(\d+)$') { throw "Último release com tag inesperada: $latest" }
          $major = [int]$Matches[1]; $minor = [int]$Matches[2]; $patch = [int]$Matches[3]
          # Mensagens de todos os commits do push (ou do PR/execução manual: só o último).
          $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $messages = if ($event.commits) { ($event.commits | ForEach-Object { $_.message }) -join "`n" } else { git log -1 --pretty=%B }
          if ($messages -match '#major') { $major++; $minor = 0; $patch = 0 }
          elseif ($messages -match '#minor') { $minor++; $patch = 0 }
          else { $patch++ }
          $version = [version]"$major.$minor.$patch"
          # O csproj funciona como versão mínima: subir o número lá também força um salto.
          $declared = [version](([xml](Get-Content -Raw src/ConverterAqui.csproj)).Project.PropertyGroup.Version)
          if ($declared -gt $version) { $version = $declared }
          $publish = $env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -ne 'pull_request'
          Write-Host "Último release: $latest  ->  nova versão: $version  (publicar: $publish)"
          "value=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Obter componentes do instalador ${{ env.COMPONENTS_RELEASE }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'base'
          gh release download $env:COMPONENTS_RELEASE --repo $env:GITHUB_REPOSITORY --pattern '*-Setup-win-x64.exe' --pattern 'SHA256SUMS.txt' --dir $download
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível baixar o release $env:COMPONENTS_RELEASE." }
          $setup = Get-ChildItem $download -Filter '*-Setup-win-x64.exe' | Select-Object -First 1
          $line = Get-Content (Join-Path $download 'SHA256SUMS.txt') | Where-Object { $_ -like "*$($setup.Name)" } | Select-Object -First 1
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected.ToUpperInvariant()) { throw "SHA256 do instalador base não confere: $actual" }
          # Instalação silenciosa por usuário, sem menu de contexto e sem abrir o app.
          $components = Join-Path $env:RUNNER_TEMP 'componentes'
          $process = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MERGETASKS=!contextmenu', "/DIR=`"$components`"", "/LOG=`"$env:RUNNER_TEMP\instalador-base.log`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\instalador-base.log" -Tail 40; throw "Instalador base falhou com código $($process.ExitCode)." }
          "COMPONENTS_DIR=$components" >> $env:GITHUB_ENV

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe não encontrado após instalar o Inno Setup.' }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Compilar app e instalador
        shell: pwsh
        run: ./scripts/Build.ps1 -ComponentsFrom $env:COMPONENTS_DIR -InnoCompiler $env:ISCC -Version '${{ steps.version.outputs.value }}'

      - name: Testar conversões no app compilado
        shell: pwsh
        run: |
          $env:CONVERTER_AQUI_APP = (Resolve-Path 'dist/ConverterAqui-${{ steps.version.outputs.value }}-win-x64').Path
          & "$env:CONVERTER_AQUI_APP\runtime\python.exe" tests/test_conversions.py
          if ($LASTEXITCODE -ne 0) { throw 'Os testes de conversão falharam.' }

      - uses: actions/upload-artifact@v6
        with:
          name: ConverterAqui-${{ steps.version.outputs.value }}-instalador
          path: |
            dist/*-Setup-win-x64.exe
            dist/SHA256SUMS.txt
          retention-days: 7

      - name: Publicar release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $assets = @("dist/ConverterAqui-$version-Setup-win-x64.exe", 'dist/SHA256SUMS.txt')
          gh release create "v$version" @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Converter Aqui $version — Instalador completo para Windows" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar o release.' }
